[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "comfyui-multiuser"
version = "0.1.0"
description = "Multi-user authentication, permissions, and generation tracking for ComfyUI"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "witt" }
]
dependencies = [
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "aiosqlite>=0.19.0",
    "cryptography>=41.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
